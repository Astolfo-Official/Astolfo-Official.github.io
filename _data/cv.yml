cv:
  name: Xinwei Ji
  label: Graduate Student
  email: astolfo@udel.edu
#  location: Newark, DE
  image: "prof_pic.jpg"
  summary: |
    Xinwei Ji (纪鑫炜) is a third-year Ph.D. student in the Department of
    Physics and Astronomy at the University of Delaware, specializing in
    chemical physics. He is currently working on his doctoral research under
    the supervision of [Tao E. Li](https://www.taoeli.org/taos-cv).

    His research interests lie at the intersection of light-matter interaction,
    electronic structure theory, molecular simulation, and AI-enhanced scientific
    research. He develops and applies open-source simulation tools for 
    self-consistent light-matter dynamics.

    Before starting his Ph.D., Xinwei received his B.S. in Chemistry from
    Xiamen University, where he built a background in quantum chemistry. He is
    happy to discuss research ideas and potential collaboration opportunities.
    If you want to join us, also visit our group website at
    [TEL Research Group website](https://www.taoeli.org).

    Outside the lab, he enjoys running and aims to maintain a semi-professional
    level of training.
  research_tags:
    - polaritonics.md
    - MD_simulations.yml
    - scientific_agents.ai


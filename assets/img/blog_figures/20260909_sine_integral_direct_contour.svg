<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
  <title id="title">Direct residue contour with a removable singularity at zero</title>
  <desc id="desc">
    For g(z) = (exp(iz) minus 1) divided by z(1 plus z squared), the contour runs from minus R to R through the regular point zero and returns
    counterclockwise along the upper semicircle. A blue point marks the removable singularity filled in with g(0) = i. Black points mark the poles: i
    inside and minus i outside.
  </desc>
  <defs>
    <marker id="axis-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 L 3 4 Z" fill="black" />
    </marker>
    <marker id="contour-arrow" markerWidth="10" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 10 4.5 L 0 9 Z" fill="#2929ff" />
    </marker>
  </defs>
  <rect width="1000" height="670" fill="white" />
  <g stroke="black" stroke-width="2" fill="none" marker-end="url(#axis-arrow)">
    <path d="M 55 455 H 935" />
    <path d="M 490 625 V 35" />
  </g>
  <g stroke="#2929ff" stroke-width="3.5" fill="none">
    <path d="M 140 455 H 840 A 350 350 0 0 0 140 455" />
    <path d="M 265 455 H 325" marker-end="url(#contour-arrow)" />
    <path d="M 645 455 H 705" marker-end="url(#contour-arrow)" />
    <path d="M 793.1 280 A 350 350 0 0 0 750.1 220.8" marker-end="url(#contour-arrow)" />
    <path d="M 242.5 207.5 A 350 350 0 0 0 206.8 249.3" marker-end="url(#contour-arrow)" />
  </g>
  <circle cx="490" cy="455" r="5" fill="#2929ff" />
  <path d="M 500 468 L 550 522 H 570" fill="none" stroke="#666666" stroke-width="1.5" />
  <g fill="black">
    <circle cx="490" cy="315" r="6" />
    <circle cx="490" cy="595" r="6" />
  </g>
  <g font-family="'Times New Roman', Times, serif" font-size="31" fill="black">
    <text x="930" y="500">
      Re
      <tspan font-style="italic">z</tspan>
    </text>
    <text x="458" y="29">
      Im
      <tspan font-style="italic">z</tspan>
    </text>
    <text x="125" y="497">
      −
      <tspan font-style="italic">R</tspan>
    </text>
    <text x="829" y="497" font-style="italic">R</text>
    <text x="462" y="491">0</text>
    <text x="510" y="322" font-style="italic">i</text>
    <text x="510" y="604">
      −
      <tspan font-style="italic">i</tspan>
    </text>
    <text x="805" y="255" font-style="italic">
      γ
      <tspan baseline-shift="sub" font-size="22">R</tspan>
    </text>
    <text x="345" y="235" font-style="italic">
      C
      <tspan baseline-shift="sub" font-size="22">R</tspan>
    </text>
    <text x="576" y="378" font-size="28">R &gt; 1</text>
    <text x="548" y="322" font-size="24">simple pole</text>
    <text x="585" y="526" font-size="25">g(0) = i</text>
    <text x="585" y="557" font-size="23" fill="#555555">removable singularity</text>
  </g>
</svg>

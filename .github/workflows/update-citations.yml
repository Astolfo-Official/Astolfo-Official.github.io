name: Update Google Scholar Citations

on:
  schedule:
    - cron: "17 6 * * *" # Daily at 06:17 UTC; off-minute scheduling reduces runner congestion.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: update-google-scholar-citations
      cancel-in-progress: false
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # Deploy site runs via workflow_run after a successful citation update.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase"

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_before=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script
        id: run_citation_update
        shell: bash
        run: |
          set +e
          max_attempts=2
          start_time=$(date)
          status=1

          for attempt in $(seq 1 $max_attempts); do
            echo "🚀 Running citation update attempt $attempt of $max_attempts..."
            timeout 240 python -u bin/update_scholar_citations.py
            status=$?

            if [ $status -eq 0 ]; then
              end_time=$(date)
              echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
              echo "✅ Citation update succeeded on attempt $attempt." >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            echo "⚠️ Citation update attempt $attempt failed with exit code $status."
            if [ $attempt -lt $max_attempts ]; then
              echo "⏳ Waiting 60 seconds before the final attempt..."
              sleep 60
            fi
          done

          end_time=$(date)
          echo "❌ Citation update failed after $max_attempts attempts (started at $start_time, ended at $end_time)."
          echo "❌ Citation update failed after $max_attempts attempts; final exit code: $status." >> $GITHUB_STEP_SUMMARY
          exit $status

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_after=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit and push if changed
        run: |
          git add _data/citations.yml
          git diff --staged --quiet || (
            echo "📤 Committing and pushing changes..."
            git commit -m "Update Google Scholar citations"
            git push
          )

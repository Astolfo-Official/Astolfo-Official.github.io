<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">Upper semicircular contour for the rational integral</title>
  <desc id="desc">
    The real segment runs from minus R to R, and the upper semicircle returns counterclockwise. The poles ip, iq, and ir are enclosed; minus ip, minus
    iq, and minus ir are outside. The illustrated ordering is zero less than p less than q less than r, with R greater than all three parameters.
  </desc>
  <defs>
    <marker id="axis-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 L 3 4 Z" fill="black" />
    </marker>
    <marker id="contour-arrow" markerWidth="10" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 10 4.5 L 0 9 Z" fill="#2929ff" />
    </marker>
  </defs>
  <rect width="1000" height="800" fill="white" />
  <g stroke="black" stroke-width="2" fill="none" marker-end="url(#axis-arrow)">
    <path d="M 55 455 H 935" />
    <path d="M 490 755 V 35" />
  </g>
  <g stroke="#2929ff" stroke-width="3.5" fill="none">
    <path d="M 140 455 H 840 A 350 350 0 0 0 140 455" />
    <path d="M 265 455 H 325" marker-end="url(#contour-arrow)" />
    <path d="M 645 455 H 705" marker-end="url(#contour-arrow)" />
    <path d="M 793.1 280 A 350 350 0 0 0 750.1 220.8" marker-end="url(#contour-arrow)" />
    <path d="M 242.5 207.5 A 350 350 0 0 0 206.8 249.3" marker-end="url(#contour-arrow)" />
  </g>
  <g fill="black">
    <circle cx="490" cy="375" r="6" />
    <circle cx="490" cy="300" r="6" />
    <circle cx="490" cy="220" r="6" />
    <circle cx="490" cy="535" r="6" />
    <circle cx="490" cy="610" r="6" />
    <circle cx="490" cy="690" r="6" />
  </g>
  <g font-family="'Times New Roman', Times, serif" font-size="31" fill="black">
    <text x="930" y="500">
      Re
      <tspan font-style="italic">z</tspan>
    </text>
    <text x="458" y="29">
      Im
      <tspan font-style="italic">z</tspan>
    </text>
    <text x="125" y="497">
      −
      <tspan font-style="italic">R</tspan>
    </text>
    <text x="829" y="497" font-style="italic">R</text>
    <text x="462" y="491">0</text>
    <text x="510" y="383" font-style="italic">ip</text>
    <text x="510" y="308" font-style="italic">iq</text>
    <text x="510" y="228" font-style="italic">ir</text>
    <text x="510" y="543" font-style="italic">−ip</text>
    <text x="510" y="618" font-style="italic">−iq</text>
    <text x="510" y="698" font-style="italic">−ir</text>
    <text x="805" y="255" font-style="italic">
      γ
      <tspan baseline-shift="sub" font-size="22">R</tspan>
    </text>
    <text x="345" y="235" font-style="italic">
      C
      <tspan baseline-shift="sub" font-size="22">R</tspan>
    </text>
    <text x="580" y="385" font-size="26">R &gt; max(p, q, r)</text>
  </g>
</svg>
